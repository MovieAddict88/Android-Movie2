name: cinedex
description: "A professional movie application for streaming movies, series, and live TV."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  chewie: ^1.10.0
  video_player: ^2.10.1
  flutter_inappwebview: ^6.1.5
  cached_network_image: ^3.4.1
  provider: ^6.1.2
  json_annotation: ^4.9.0
  intl: ^0.20.2
  shimmer: ^3.0.0
  better_player: ^0.0.83
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
